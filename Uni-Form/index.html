<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="1부터 45까지 중복 없이 6개의 로또 번호를 뽑아보세요.">
  <title>행운 번호 추첨기</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17233c;
      --muted: #68738a;
      --paper: #fffdf8;
      --blue: #3157d5;
      --blue-dark: #203b9e;
      --line: #e6e3da;
      --shadow: 0 24px 70px rgba(26, 39, 74, 0.13);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 18%, rgba(255, 210, 82, 0.25), transparent 25rem),
        radial-gradient(circle at 88% 86%, rgba(60, 99, 224, 0.18), transparent 28rem),
        #f3f0e8;
      font-family: Pretendard, "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: -1;
      width: 240px;
      height: 240px;
      border: 1px solid rgba(49, 87, 213, 0.13);
      border-radius: 50%;
    }

    body::before { top: -95px; right: -55px; }
    body::after { bottom: -130px; left: -45px; width: 320px; height: 320px; }

    main {
      width: min(100%, 760px);
      padding: clamp(28px, 6vw, 64px);
      background: rgba(255, 253, 248, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 32px;
      box-shadow: var(--shadow);
      text-align: center;
      backdrop-filter: blur(14px);
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--blue);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.18em;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 3.7rem);
      line-height: 1.1;
      letter-spacing: -0.05em;
    }

    .lead {
      margin: 16px auto 0;
      color: var(--muted);
      line-height: 1.7;
      word-break: keep-all;
    }

    .machine {
      margin: clamp(32px, 6vw, 52px) 0 30px;
      padding: clamp(22px, 5vw, 36px) clamp(16px, 4vw, 30px);
      border: 1px solid var(--line);
      border-radius: 24px;
      background: #fff;
    }

    .numbers {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: clamp(7px, 1.5vw, 13px);
      min-height: 74px;
      align-items: center;
    }

    .ball {
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      font-size: clamp(1rem, 3vw, 1.45rem);
      font-weight: 850;
      box-shadow: inset 0 -5px 0 rgba(0, 0, 0, 0.11), 0 8px 16px rgba(20, 31, 60, 0.13);
      transform: scale(1);
    }

    .ball.pop { animation: pop 520ms cubic-bezier(.2, .9, .3, 1.3) both; }
    .ball:nth-child(2) { animation-delay: 55ms; }
    .ball:nth-child(3) { animation-delay: 110ms; }
    .ball:nth-child(4) { animation-delay: 165ms; }
    .ball:nth-child(5) { animation-delay: 220ms; }
    .ball:nth-child(6) { animation-delay: 275ms; }

    @keyframes pop {
      0% { opacity: 0; transform: translateY(18px) scale(0.55) rotate(-8deg); }
      75% { opacity: 1; transform: translateY(-3px) scale(1.06); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .range-1 { background: #e9ad20; }
    .range-2 { background: #3a77ce; }
    .range-3 { background: #e35b5b; }
    .range-4 { background: #71808f; }
    .range-5 { background: #55a65d; }

    .hint {
      margin: 18px 0 0;
      color: #8b94a5;
      font-size: 0.82rem;
    }

    button {
      width: min(100%, 300px);
      border: 0;
      border-radius: 999px;
      padding: 17px 24px;
      color: #fff;
      background: var(--blue);
      box-shadow: 0 12px 24px rgba(49, 87, 213, 0.25);
      font: inherit;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    button:hover { background: var(--blue-dark); transform: translateY(-2px); box-shadow: 0 15px 28px rgba(49, 87, 213, 0.3); }
    button:active { transform: translateY(0); }
    button:focus-visible { outline: 4px solid rgba(49, 87, 213, 0.23); outline-offset: 4px; }

    .notice {
      margin: 24px 0 0;
      color: var(--muted);
      font-size: 0.78rem;
    }

    @media (max-width: 560px) {
      body { padding: 14px; }
      main { border-radius: 24px; }
      .numbers { grid-template-columns: repeat(3, 1fr); gap: 14px; max-width: 270px; margin: 0 auto; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">LUCKY DRAW</p>
    <h1>오늘의 행운 번호</h1>
    <p class="lead">버튼을 누르면 1부터 45까지의 숫자 중<br>중복 없이 6개를 뽑아드려요.</p>

    <section class="machine" aria-labelledby="result-title">
      <h2 id="result-title" hidden>추첨 결과</h2>
      <div class="numbers" id="numbers" aria-live="polite" aria-atomic="true"></div>
      <p class="hint">번호는 작은 숫자부터 정렬됩니다.</p>
    </section>

    <button type="button" id="drawButton">행운 번호 뽑기</button>
    <p class="notice">재미로 즐겨주세요. 당첨을 보장하지 않습니다.</p>
  </main>

  <script>
    const numbersElement = document.getElementById('numbers');
    const drawButton = document.getElementById('drawButton');

    function getColorClass(number) {
      if (number <= 10) return 'range-1';
      if (number <= 20) return 'range-2';
      if (number <= 30) return 'range-3';
      if (number <= 40) return 'range-4';
      return 'range-5';
    }

    function drawNumbers() {
      const pool = Array.from({ length: 45 }, (_, index) => index + 1);

      for (let index = pool.length - 1; index > 0; index -= 1) {
        const randomIndex = Math.floor(Math.random() * (index + 1));
        [pool[index], pool[randomIndex]] = [pool[randomIndex], pool[index]];
      }

      const result = pool.slice(0, 6).sort((a, b) => a - b);
      numbersElement.replaceChildren();

      result.forEach((number) => {
        const ball = document.createElement('span');
        ball.className = `ball pop ${getColorClass(number)}`;
        ball.textContent = number;
        ball.setAttribute('aria-label', `${number}번`);
        numbersElement.appendChild(ball);
      });

      numbersElement.setAttribute('aria-label', `추첨 결과: ${result.join(', ')}`);
      drawButton.textContent = '다시 뽑기';
    }

    drawButton.addEventListener('click', drawNumbers);
    drawNumbers();
  </script>
</body>
</html>
